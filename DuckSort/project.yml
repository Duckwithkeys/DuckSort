name: DuckSort
options:
  bundleIdPrefix: com.oliver
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_VERSION: "6.0"

targets:
  DuckSort:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: DuckSort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliver.DuckSort
        PRODUCT_NAME: DuckSort
        INFOPLIST_FILE: DuckSort/Info.plist
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ALWAYS_SEARCH_USER_PATHS: NO
        CLANG_ENABLE_OBJC_ARC: YES

  DuckSortTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests/DuckSortTests
    dependencies:
      - target: DuckSort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliver.DuckSortTests
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
